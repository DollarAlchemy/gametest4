<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LABYRNTH</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg1:     #1f0b3a;
  --bg2:     #2d1060;
  --card:    #ffffff0f;
  --rim:     #ffffff18;
  --orange:  #ff7043;
  --mint:    #00e896;
  --yellow:  #ffd740;
  --red:     #ff4d6d;
  --blue:    #4fc3f7;
  --purple:  #ce93d8;
  --wall:    #7c3aed;
  --wall2:   #a855f7;
  --text:    #f0e6ff;
  --muted:   #9d8abf;
  --radius:  18px;
  --brad:    12px;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
}

body {
  background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
  color: var(--text);
  font-family: 'Nunito', 'Helvetica Neue', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100dvh;
  overflow: hidden;
  padding: 0;
  gap: 0;
}

/* ── HEADER ───────────────────────────────────── */
.header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px 6px;
  flex-shrink: 0;
}

.logo {
  font-family: 'Fredoka One', cursive;
  font-size: 1.7rem;
  letter-spacing: 0.04em;
  background: linear-gradient(135deg, var(--orange), var(--yellow));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
}

.timer-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--rim);
  border-radius: 30px;
  padding: 5px 14px;
}

.timer-icon { font-size: 0.85rem; }

#timer-display {
  font-family: 'Fredoka One', cursive;
  font-size: 1.1rem;
  color: var(--yellow);
  letter-spacing: 0.04em;
  min-width: 64px;
  text-align: right;
}
#timer-display.running { color: var(--mint); }

/* ── STATS ROW ────────────────────────────────── */
.stats-row {
  width: 100%;
  display: flex;
  gap: 8px;
  padding: 0 16px 6px;
  flex-shrink: 0;
}

.stat-chip {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--rim);
  border-radius: 30px;
  padding: 5px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.stat-chip .label {
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.stat-chip .value {
  font-family: 'Fredoka One', cursive;
  font-size: 0.95rem;
  color: var(--text);
}
.stat-chip .value.gold { color: var(--yellow); }
.stat-chip .value.green { color: var(--mint); }

/* ── DIFF PILLS ───────────────────────────────── */
.diff-row {
  display: flex;
  gap: 8px;
  padding: 0 16px 6px;
  flex-shrink: 0;
  width: 100%;
}

.diff-pill {
  flex: 1;
  background: transparent;
  border: 1.5px solid var(--rim);
  border-radius: 30px;
  font-family: 'Nunito', sans-serif;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 7px 4px;
  cursor: pointer;
  transition: all 0.15s;
}
.diff-pill.active {
  border-color: var(--orange);
  color: var(--orange);
  background: rgba(255,112,67,0.12);
  box-shadow: 0 0 14px rgba(255,112,67,0.25);
}

/* ── CANVAS ───────────────────────────────────── */
.canvas-area {
  position: relative;
  flex-shrink: 0;
  margin: 0 auto;
  border-radius: var(--brad);
  overflow: hidden;
  box-shadow:
    0 0 0 1.5px rgba(168,85,247,0.5),
    0 0 30px rgba(168,85,247,0.2),
    0 8px 40px rgba(0,0,0,0.5);
}

#mazeCanvas {
  display: block;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

/* ── WIN OVERLAY ─────────────────────────────── */
.win-overlay {
  position: absolute;
  inset: 0;
  background: rgba(20, 5, 40, 0.93);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
  border-radius: var(--brad);
  backdrop-filter: blur(4px);
}
.win-overlay.show { opacity: 1; pointer-events: all; }

.win-emoji { font-size: 2.8rem; animation: bounce-pop 0.6s ease; }
@keyframes bounce-pop {
  0%   { transform: scale(0); }
  60%  { transform: scale(1.25); }
  100% { transform: scale(1); }
}

.win-title {
  font-family: 'Fredoka One', cursive;
  font-size: 2rem;
  letter-spacing: 0.04em;
  background: linear-gradient(135deg, var(--mint), var(--blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.win-time-val {
  font-family: 'Fredoka One', cursive;
  font-size: 1.4rem;
  color: var(--yellow);
}

.win-best-label {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--purple);
}

.win-next-btn {
  margin-top: 8px;
  background: linear-gradient(135deg, var(--orange), #ff9800);
  border: none;
  border-radius: 30px;
  font-family: 'Fredoka One', cursive;
  font-size: 1rem;
  letter-spacing: 0.04em;
  color: #fff;
  padding: 12px 30px;
  cursor: pointer;
  box-shadow: 0 4px 18px rgba(255,112,67,0.5);
  transition: transform 0.1s;
}
.win-next-btn:active { transform: scale(0.95); }

/* ── D-PAD ────────────────────────────────────── */
.controls-area {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 16px 4px;
  flex-shrink: 0;
  width: 100%;
  gap: 10px;
}

.dpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows:    repeat(3, 1fr);
  gap: 5px;
  width: 150px;
  flex-shrink: 0;
}

.dpad-btn {
  background: var(--card);
  border: 1.5px solid var(--rim);
  border-radius: 12px;
  color: var(--text);
  font-size: 1.3rem;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 46px;
  cursor: pointer;
  transition: background 0.1s, transform 0.07s, box-shadow 0.1s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.dpad-btn:active, .dpad-btn.pressed {
  background: rgba(168,85,247,0.3);
  border-color: var(--wall2);
  transform: scale(0.92);
  box-shadow: 0 0 12px rgba(168,85,247,0.4);
}

.dpad-up    { grid-column: 2; grid-row: 1; }
.dpad-left  { grid-column: 1; grid-row: 2; }
.dpad-center{ grid-column: 2; grid-row: 2; background: rgba(0,0,0,0.2); border-color: transparent; cursor: default; }
.dpad-right { grid-column: 3; grid-row: 2; }
.dpad-down  { grid-column: 2; grid-row: 3; }

/* ── SIDE BUTTONS ────────────────────────────── */
.side-btns {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
  max-width: 170px;
}

.action-btn {
  width: 100%;
  border: 1.5px solid;
  border-radius: 30px;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.78rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  padding: 10px 10px;
  cursor: pointer;
  background: transparent;
  transition: background 0.12s, box-shadow 0.12s, transform 0.08s;
}
.action-btn:active { transform: scale(0.96); }

.btn-new   { border-color: var(--mint);   color: var(--mint); }
.btn-reset { border-color: var(--orange); color: var(--orange); }
.btn-new:active   { background: rgba(0,232,150,0.12); }
.btn-reset:active { background: rgba(255,112,67,0.12); }

/* ── FOOTER HINT ─────────────────────────────── */
.hint-bar {
  font-size: 0.6rem;
  color: var(--muted);
  letter-spacing: 0.06em;
  text-align: center;
  padding: 2px 0 6px;
  flex-shrink: 0;
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">LABYRNTH</div>
  <div class="timer-wrap">
    <span class="timer-icon">⏱</span>
    <span id="timer-display">00:00.0</span>
  </div>
</div>

<!-- STATS -->
<div class="stats-row">
  <div class="stat-chip">
    <span class="label">Done</span>
    <span class="value green" id="stat-done">0</span>
  </div>
  <div class="stat-chip">
    <span class="label">Best</span>
    <span class="value gold" id="stat-best">—</span>
  </div>
  <div class="stat-chip">
    <span class="label">Steps</span>
    <span class="value" id="stat-steps">—</span>
  </div>
</div>

<!-- DIFFICULTY -->
<div class="diff-row">
  <button class="diff-pill active" id="dp-easy"   onclick="setDiff('easy')">Easy</button>
  <button class="diff-pill"        id="dp-medium" onclick="setDiff('medium')">Medium</button>
  <button class="diff-pill"        id="dp-hard"   onclick="setDiff('hard')">Hard</button>
</div>

<!-- CANVAS -->
<div class="canvas-area" id="canvasArea">
  <canvas id="mazeCanvas"></canvas>
  <div class="win-overlay" id="winOverlay">
    <div class="win-emoji">🎉</div>
    <div class="win-title">SOLVED!</div>
    <div class="win-time-val" id="winTime"></div>
    <div class="win-best-label" id="winBestLabel"></div>
    <button class="win-next-btn" onclick="newMaze()">Next Maze ▶</button>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls-area">
  <div class="dpad">
    <div class="dpad-btn dpad-up"     id="btn-up"    ontouchstart="dpadPress(event,'up')"    ontouchend="dpadRelease(event,'up')">▲</div>
    <div class="dpad-btn dpad-left"   id="btn-left"  ontouchstart="dpadPress(event,'left')"  ontouchend="dpadRelease(event,'left')">◀</div>
    <div class="dpad-btn dpad-center" id="btn-center"></div>
    <div class="dpad-btn dpad-right"  id="btn-right" ontouchstart="dpadPress(event,'right')" ontouchend="dpadRelease(event,'right')">▶</div>
    <div class="dpad-btn dpad-down"   id="btn-down"  ontouchstart="dpadPress(event,'down')"  ontouchend="dpadRelease(event,'down')">▼</div>
  </div>

  <div class="side-btns">
    <button class="action-btn btn-new"   onclick="newMaze()">⟳ New Maze</button>
    <button class="action-btn btn-reset" onclick="resetPath()">✕ Reset Path</button>
  </div>
</div>

<!-- HINT -->
<div class="hint-bar" id="hintBar">Tap START then use D-pad or swipe to navigate · Reach EXIT to win</div>

<script>
// ═══════════════════════════════════════════════
// LABYRNTH — Mobile Maze Game
// Randomized DFS perfect maze: every cell reachable,
// exactly one solution path, zero dead-end islands.
// ═══════════════════════════════════════════════

// ── Direction constants ─────────────────────────
const N=1, S=2, E=4, W=8;
const OPP  = { [N]:S, [S]:N, [E]:W, [W]:E };
const DXDY = { [N]:[0,-1], [S]:[0,1], [E]:[1,0], [W]:[-1,0] };
const DIRS = [N, S, E, W];

const DIFF_CFG = {
  easy:   { size: 11 },
  medium: { size: 15 },
  hard:   { size: 21 },
};

// ── Game State ──────────────────────────────────
let maze=[], COLS=0, ROWS=0, CELL=0;
let playerCol=0, playerRow=0;
let pathCells=[];   // [{c,r}, …]
let visited = null; // Set of "c,r" strings for no-loop enforcement
let solved=false;
let difficulty='easy';

// ── Timer ───────────────────────────────────────
let timerInt=null, timerRunning=false, startTime=null, elapsedMs=0;

const canvas = document.getElementById('mazeCanvas');
const ctx    = canvas.getContext('2d');

// ── Canvas sizing ───────────────────────────────
function computeCanvasSize() {
  const maxSide = Math.min(
    window.innerWidth  - 32,
    window.innerHeight * 0.48,   // leave room for controls
    420
  );
  return Math.floor(maxSide);
}

// ── Maze Generation (Iterative DFS) ────────────
function generateMaze(cols, rows) {
  const grid    = Array.from({length:rows}, ()=> new Int8Array(cols));
  const visited = Array.from({length:rows}, ()=> new Uint8Array(cols));

  function shuffle(arr) {
    for (let i=arr.length-1;i>0;i--) {
      const j=(Math.random()*(i+1))|0;
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  const stack=[[0,0]];
  visited[0][0]=1;
  while (stack.length) {
    const [c,r]=stack[stack.length-1];
    const dirs=shuffle(DIRS.slice());
    let moved=false;
    for (const d of dirs) {
      const [dc,dr]=DXDY[d];
      const nc=c+dc, nr=r+dr;
      if (nc>=0 && nc<cols && nr>=0 && nr<rows && !visited[nr][nc]) {
        grid[r][c]  |= d;
        grid[nr][nc]|= OPP[d];
        visited[nr][nc]=1;
        stack.push([nc,nr]);
        moved=true;
        break;
      }
    }
    if (!moved) stack.pop();
  }
  return grid;
}

// ── Drawing ─────────────────────────────────────
function draw() {
  const cw=canvas.width, ch=canvas.height;
  ctx.clearRect(0,0,cw,ch);

  // Dark bg
  ctx.fillStyle='#140828';
  ctx.fillRect(0,0,cw,ch);

  // Subtle dot grid
  ctx.fillStyle='rgba(255,255,255,0.025)';
  for (let r=0;r<=ROWS;r++) for (let c=0;c<=COLS;c++) ctx.fillRect(c*CELL,r*CELL,1,1);

  // Start cell tint
  drawCellTint(0,0,'rgba(0,232,150,0.18)');
  // Exit cell tint
  drawCellTint(COLS-1,ROWS-1,'rgba(255,77,109,0.18)');

  // Path trail
  if (pathCells.length>1) {
    ctx.save();
    // Glow
    ctx.globalAlpha=0.4;
    ctx.shadowColor='#ff9800';
    ctx.shadowBlur=12;
    ctx.strokeStyle='#ff9800';
    ctx.lineWidth=Math.max(5, CELL*0.38);
    ctx.lineCap=ctx.lineJoin='round';
    drawPathLine();
    // Core
    ctx.globalAlpha=1;
    ctx.shadowBlur=4;
    ctx.strokeStyle='#ffcc02';
    ctx.lineWidth=Math.max(3, CELL*0.22);
    drawPathLine();
    ctx.restore();
  }

  // Walls
  ctx.save();
  ctx.lineCap='square';
  for (let r=0;r<ROWS;r++) {
    for (let c=0;c<COLS;c++) {
      const p=maze[r][c];
      const x=c*CELL, y=r*CELL;
      if (!(p&S) && r<ROWS-1) drawWall(x,y+CELL,x+CELL,y+CELL);
      if (!(p&E) && c<COLS-1) drawWall(x+CELL,y,x+CELL,y+CELL);
    }
  }
  // Outer border
  ctx.shadowColor='#a855f7';
  ctx.shadowBlur=10;
  ctx.strokeStyle='#a855f7';
  ctx.lineWidth=2;
  ctx.strokeRect(1,1,cw-2,ch-2);
  ctx.restore();

  // S / E labels
  const fs = Math.max(9, (CELL*0.42)|0);
  ctx.save();
  ctx.font=`700 ${fs}px "Fredoka One", cursive`;
  ctx.textAlign='center'; ctx.textBaseline='middle';

  ctx.fillStyle='#00e896';
  ctx.shadowColor='#00e896'; ctx.shadowBlur=10;
  ctx.fillText('S', cx(0), cy(0));

  ctx.fillStyle='#ff4d6d';
  ctx.shadowColor='#ff4d6d'; ctx.shadowBlur=10;
  ctx.fillText('E', cx(COLS-1), cy(ROWS-1));
  ctx.restore();

  // Player dot
  if (pathCells.length>0) {
    const last=pathCells[pathCells.length-1];
    const r=Math.max(5, CELL*0.22);
    ctx.save();
    ctx.shadowColor='#ffffff'; ctx.shadowBlur=16;
    ctx.fillStyle='#ffffff';
    ctx.beginPath();
    ctx.arc(cx(last.c), cy(last.r), r, 0, Math.PI*2);
    ctx.fill();
    // Ring
    ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.lineWidth=1.5;
    ctx.shadowBlur=0;
    ctx.beginPath();
    ctx.arc(cx(last.c), cy(last.r), r+3, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawCellTint(c,r,color) {
  ctx.fillStyle=color;
  ctx.fillRect(c*CELL+1, r*CELL+1, CELL-2, CELL-2);
}

function drawWall(x1,y1,x2,y2) {
  const thick=Math.max(1.5, CELL*0.1);
  ctx.shadowColor='rgba(168,85,247,0.6)';
  ctx.shadowBlur=6;
  ctx.strokeStyle='#5b21b6';
  ctx.lineWidth=thick;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.strokeStyle='#7c3aed';
  ctx.lineWidth=thick*0.5;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}

function drawPathLine() {
  ctx.beginPath();
  ctx.moveTo(cx(pathCells[0].c), cy(pathCells[0].r));
  for (let i=1;i<pathCells.length;i++) ctx.lineTo(cx(pathCells[i].c), cy(pathCells[i].r));
  ctx.stroke();
}

const cx = c => c*CELL + CELL/2;
const cy = r => r*CELL + CELL/2;

// ── Movement ─────────────────────────────────────
function passageOpen(c1,r1,c2,r2) {
  const dc=c2-c1, dr=r2-r1;
  if (Math.abs(dc)+Math.abs(dr)!==1) return false;
  let d;
  if (dr===-1) d=N; else if (dr===1) d=S;
  else if (dc===1) d=E; else d=W;
  return !!(maze[r1][c1]&d);
}

function movePlayer(dc, dr) {
  if (solved) return;

  // Not yet started — require player to be at START first
  if (pathCells.length===0) {
    // Auto-place at start and begin
    pathCells=[{c:0,r:0}];
    visited=new Set(['0,0']);
    startTimer();
  }

  const last=pathCells[pathCells.length-1];
  const nc=last.c+dc, nr=last.r+dr;

  if (nc<0||nc>=COLS||nr<0||nr>=ROWS) return;
  if (!passageOpen(last.c,last.r,nc,nr)) return;

  // Backtrack?
  if (pathCells.length>=2) {
    const prev=pathCells[pathCells.length-2];
    if (prev.c===nc && prev.r===nr) {
      visited.delete(`${last.c},${last.r}`);
      pathCells.pop();
      document.getElementById('stat-steps').textContent=pathCells.length;
      draw();
      return;
    }
  }

  // No revisit (anti-loop)
  if (visited.has(`${nc},${nr}`)) return;

  pathCells.push({c:nc,r:nr});
  visited.add(`${nc},${nr}`);
  document.getElementById('stat-steps').textContent=pathCells.length;
  draw();
  checkWin();
}

function checkWin() {
  const last=pathCells[pathCells.length-1];
  if (last.c===COLS-1 && last.r===ROWS-1) {
    solved=true;
    stopTimer();
    recordWin();
    const best=getBest();
    const isNew=best===elapsedMs;
    document.getElementById('winTime').textContent=fmtTime(elapsedMs);
    document.getElementById('winBestLabel').textContent=isNew?'★ NEW BEST! ★':'Best: '+fmtTime(best);
    document.getElementById('winOverlay').classList.add('show');
    draw();
  }
}

// ── Init ────────────────────────────────────────
function newMaze() {
  document.getElementById('winOverlay').classList.remove('show');
  const side=computeCanvasSize();
  const sz=DIFF_CFG[difficulty].size;
  COLS=sz; ROWS=sz;
  CELL=Math.floor(side/sz);
  const actual=CELL*sz;
  canvas.width=actual; canvas.height=actual;
  document.getElementById('canvasArea').style.width  = actual+'px';
  document.getElementById('canvasArea').style.height = actual+'px';

  maze=generateMaze(COLS,ROWS);
  pathCells=[]; visited=new Set();
  solved=false;
  resetTimerState();
  document.getElementById('stat-steps').textContent='—';
  document.getElementById('hintBar').textContent='Tap D-pad or swipe to start from S · Reach E to win';
  refreshStats();
  draw();
}

function resetPath() {
  if (solved) return;
  pathCells=[]; visited=new Set();
  resetTimerState();
  document.getElementById('stat-steps').textContent='—';
  draw();
}

function setDiff(d) {
  difficulty=d;
  ['easy','medium','hard'].forEach(k=>
    document.getElementById('dp-'+k).classList.toggle('active',k===d));
  newMaze();
}

// ── Timer ────────────────────────────────────────
function startTimer() {
  if (timerRunning) return;
  timerRunning=true;
  startTime=Date.now()-elapsedMs;
  timerInt=setInterval(()=>{ elapsedMs=Date.now()-startTime; updateTimerEl(); },100);
  document.getElementById('timer-display').classList.add('running');
}

function stopTimer() {
  clearInterval(timerInt); timerRunning=false;
  elapsedMs=Date.now()-startTime;
  updateTimerEl();
  document.getElementById('timer-display').classList.remove('running');
}

function resetTimerState() {
  clearInterval(timerInt); timerRunning=false; elapsedMs=0; startTime=null;
  document.getElementById('timer-display').classList.remove('running');
  updateTimerEl();
}

function fmtTime(ms) {
  const t=Math.floor(ms/100);
  const m=Math.floor(t/600);
  const s=Math.floor((t%600)/10);
  const d=t%10;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${d}`;
}

function updateTimerEl() {
  document.getElementById('timer-display').textContent=fmtTime(elapsedMs);
}

function getBest() { return parseInt(localStorage.getItem(storageKey('best'))||'0')||0; }

function recordWin() {
  const ck=storageKey('count'), bk=storageKey('best');
  const c=parseInt(localStorage.getItem(ck)||'0')+1;

  const pb=getBest();
  if (!pb||elapsedMs<pb) localStorage.setItem(bk,elapsedMs);
  refreshStats();
}
